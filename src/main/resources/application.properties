spring.application.name=jsonplaceholder

# HTTPリクエストのログ（DispatcherServletのトレース）を出力する設定
logging.level.org.springframework.web=DEBUG

# H2 データベース設定
spring.datasource.url=jdbc:h2:mem:jsondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console を有効化 (/h2-console でWebブラウザからDB確認可能)
spring.h2.console.enabled=false

# schema.sql / data.sql を自動実行する設定
spring.sql.init.mode=always

# MyBatis 設定: スネークケース(user_id) -> キャメルケース(userId) 自動変換
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
logging.level.net.wellflat.jsonplaceholder.post.PostMapper=INFO

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
